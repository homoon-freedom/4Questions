<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>내면의 작업 (The Work) - 네 가지 질문 워크북</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-main: #F7F5F0;
      --bg-card: #FFFFFF;
      --bg-subtle: #F0ECE3;
      --bg-accent-soft: #E8EFEA;
      --primary: #3B594A;
      --primary-hover: #2D463A;
      --secondary: #8C6D53;
      --text-main: #262522;
      --text-muted: #66625A;
      --border: #DDD7CC;
      --border-focus: #3B594A;
      --shadow-sm: 0 2px 8px rgba(38, 37, 34, 0.05);
      --shadow-md: 0 8px 24px rgba(38, 37, 34, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 상단 고정 헤더 (태블릿 최적화) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 245, 240, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 12px;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-left: 8px;
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .save-badge {
      font-size: 0.82rem;
      color: var(--primary);
      background: var(--bg-accent-soft);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* 버튼 스타일 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 9px 15px;
      border-radius: var(--radius-sm);
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .btn-sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.86rem;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: #FFFFFF;
    }

    .btn-secondary:hover {
      background: #765A43;
    }

    .btn-outline {
      background: #FFFFFF;
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
    }

    .btn-danger-outline {
      background: #FFFFFF;
      color: #A63A3A;
      border-color: #E2C6C6;
    }

    .btn-danger-outline:hover {
      background: #FDF3F3;
    }

    .btn-danger-solid {
      background: #A63A3A;
      color: #FFFFFF;
    }

    .btn-kakao {
      background: #FEE500;
      color: #191919;
      font-weight: 700;
    }

    .btn-kakao:hover {
      background: #F4DC00;
    }

    /* 3단계 네비게이션 탭 */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .step-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .step-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.08);
    }

    .step-tab.active .step-num {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* 메인 컨테이너 */
    .main-container {
      max-width: 960px;
      margin: 24px auto 60px;
      padding: 0 24px;
    }

    .active-record-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #FFFDF8;
      border: 1px solid #E3D9C6;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--secondary);
    }

    .guide-banner {
      background: var(--bg-accent-soft);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 22px;
      color: var(--text-main);
    }

    .guide-banner h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .guide-banner p {
      margin: 0;
      font-size: 0.96rem;
      color: #3A3D3B;
    }

    /* 질문 카드 */
    .q-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .q-badge {
      flex-shrink: 0;
      background: var(--primary);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 11px;
      border-radius: 20px;
      margin-top: 2px;
    }

    .q-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
    }

    .q-hint {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* 스크롤 없는 자동 줄바꿈 & 자동 크기 확장 입력창 */
    textarea.auto-field {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 12px 15px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-main);
      background-color: #FCFBF8;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      resize: none !important;
      overflow: hidden !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: keep-all;
      transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea.auto-field:focus {
      outline: none;
      border-color: var(--border-focus);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(59, 89, 74, 0.12);
    }

    textarea.auto-field::placeholder {
      color: #A49E93;
    }

    /* 문장 내 인라인 자동 확장 입력창 */
    .sentence-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      background: #FAF8F4;
      border: 1px solid #EAE4D9;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-top: 10px;
      font-size: 1.02rem;
      line-height: 1.8;
    }

    .sentence-text {
      color: var(--text-main);
      font-weight: 500;
    }

    .target-pill {
      display: inline-block;
      background: var(--bg-accent-soft);
      color: var(--primary);
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 6px;
      border-bottom: 2px solid var(--primary);
      max-width: 100%;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    textarea.inline-auto-field {
      display: inline-block;
      vertical-align: middle;
      min-width: 150px;
      max-width: 100%;
      min-height: 40px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-main);
      background-color: #FFFFFF;
      border: 1.5px solid #C8C0B2;
      border-radius: var(--radius-sm);
      resize: none !important;
      overflow: hidden !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: keep-all;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea.inline-auto-field:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 89, 74, 0.12);
    }

    textarea.inline-auto-field::placeholder {
      color: #A49E93;
    }

    /* 감정 선택 칩 */
    .emotion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 6px;
    }

    .chip-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .chip-btn.selected {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Yes / No 토글 버튼 (2단계 탐구) */
    .yn-group {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    .yn-btn {
      flex: 1;
      max-width: 140px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .yn-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    /* 2단계 진술 선택 바 */
    .statement-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stmt-tab {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .stmt-tab.active {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #FFFFFF;
    }

    .active-statement-box {
      background: #FFFDF8;
      border: 1.5px dashed var(--secondary);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 20px;
    }

    .active-statement-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 6px;
    }

    .active-statement-text {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 하단 단계 이동 바 */
    .step-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }

    /* 모달 스타일 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(25, 24, 22, 0.55);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .modal-box.small {
      max-width: 420px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-main);
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-main);
    }

    /* 기록 보관함 내부 스타일 */
    .save-box {
      background: var(--bg-accent-soft);
      border: 1px solid #C8D8CE;
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .save-box-title {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .save-input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: stretch;
    }

    .archive-title-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      border: 1.5px solid #B6C7BD;
      border-radius: var(--radius-sm);
      background: #FFFFFF;
      color: var(--text-main);
    }

    .archive-title-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .archive-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .archive-list-header h4 {
      margin: 0;
      font-size: 1.02rem;
      color: var(--text-main);
    }

    .archive-card {
      background: #FCFBF8;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }

    .archive-card.current-loaded {
      border-color: var(--primary);
      background: #F4F8F5;
    }

    .archive-info {
      flex: 1;
      min-width: 240px;
    }

    .archive-card-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .archive-card-meta {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .archive-card-preview {
      font-size: 0.9rem;
      color: #4A4741;
      background: #FFFFFF;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--secondary);
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .archive-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .backup-bar {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* 캡처 전용 요약 리포트 스타일 */
    #captureSummaryArea {
      background: #FAF8F4;
      border: 1px solid #DDD7CC;
      border-radius: 14px;
      padding: 28px;
      color: #262522;
    }

    .report-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .report-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }

    .report-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .report-section {
      background: #FFFFFF;
      border: 1px solid #E5DFD3;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .report-section-title {
      margin: 0 0 12px;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid #EFECE6;
      padding-bottom: 8px;
    }

    .report-item {
      margin-bottom: 12px;
    }

    .report-item:last-child {
      margin-bottom: 0;
    }

    .report-q {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 3px;
    }

    .report-a {
      font-size: 0.98rem;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: break-word;
      background: #FCFBF8;
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #D5CEC0;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(38, 37, 34, 0.92);
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 숨겨진 텍스트 너비 측정용 요소 */
    #textMeasureMirror {
      position: absolute;
      visibility: hidden;
      height: auto;
      width: auto;
      white-space: pre;
      font-size: 16px;
      font-family: inherit;
      padding: 0 12px;
    }

    @media (max-width: 680px) {
      .app-header {
        padding: 12px 16px;
      }
      .main-container {
        padding: 0 16px;
      }
      .q-card {
        padding: 18px 16px;
      }
      .step-tab {
        font-size: 0.88rem;
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 고정 헤더 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top">
        <div>
          <h1 class="brand-title">
            내면의 작업 (The Work)
            <span class="brand-subtitle">네 가지 질문 워크북</span>
          </h1>
        </div>
        <div class="header-actions">
          <span class="save-badge" id="saveStatus">자동 저장됨</span>
          <button type="button" class="btn btn-outline" onclick="app.openArchiveModal()">📂 저장 / 불러오기</button>
          <button type="button" class="btn btn-danger-outline" onclick="app.openResetModal()">초기화</button>
          <button type="button" class="btn btn-primary" onclick="app.openExportModal()">요약 및 내보내기</button>
        </div>
      </div>

      <nav class="step-tabs" aria-label="작업 단계 선택">
        <button type="button" class="step-tab active" data-step="1" onclick="app.setStep(1)">
          <span class="step-num">1</span> 스스로에게 질문하기
        </button>
        <button type="button" class="step-tab" data-step="2" onclick="app.setStep(2)">
          <span class="step-num">2</span> 스스로 하기: 탐구
        </button>
        <button type="button" class="step-tab" data-step="3" onclick="app.setStep(3)">
          <span class="step-num">3</span> 뒤바꿔보세요
        </button>
      </nav>
    </div>
  </header>

  <!-- 메인 작업 공간 -->
  <main class="main-container" id="appContent"></main>

  <!-- 기록 보관함 (저장 및 불러오기) 모달 -->
  <div class="modal-backdrop" id="archiveModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>📂 기록 보관함 (저장 및 불러오기)</h3>
        <button type="button" class="modal-close" onclick="app.closeArchiveModal()">&times;</button>
      </div>
      <div class="modal-body" id="archiveModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="app.closeArchiveModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 숨겨진 JSON 불러오기 파일 인풋 -->
  <input type="file" id="jsonFileInput" accept=".json,application/json" style="display:none;" onchange="app.handleJsonFileImport(event)" />

  <!-- 요약 및 내보내기 모달 -->
  <div class="modal-backdrop" id="exportModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>전체 작업 요약 및 이미지 공유</h3>
        <button type="button" class="modal-close" onclick="app.closeExportModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="captureSummaryArea"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="app.closeExportModal()">닫기</button>
        <button type="button" class="btn btn-outline" onclick="app.downloadSummaryImage()">🖼️ 이미지로 저장</button>
        <button type="button" class="btn btn-kakao" onclick="app.shareSummaryToKakao()">💬 카카오톡으로 이미지 공유</button>
      </div>
    </div>
  </div>

  <!-- 초기화 확인 모달 -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-box small">
      <div class="modal-header">
        <h3>새 작업 시작 (화면 초기화)</h3>
        <button type="button" class="modal-close" onclick="app.closeResetModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin: 0; font-size: 1rem;">
          현재 화면에 입력된 내용을 모두 비우고 새로운 작업을 시작할까요?<br />
          <span style="font-size: 0.88rem; color: var(--text-muted);">(기록 보관함에 미리 저장해 둔 항목은 삭제되지 않습니다.)</span>
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="app.closeResetModal()">취소</button>
        <button type="button" class="btn btn-danger-outline" onclick="app.confirmReset()">새로 시작하기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div class="toast" id="toastMsg"></div>

  <!-- 인라인 입력창 너비 계산용 미러 -->
  <span id="textMeasureMirror"></span>

  <script>
    class TheWorkApp {
      constructor() {
        this.storageKey = 'the_work_tablet_workbook_v2';
        this.archiveStorageKey = 'the_work_saved_archives_v1';
        this.currentStep = 1;
        this.activeInquiryIndex = 1;
        this.loadedArchiveId = null;
        this.confirmDeleteId = null;

        this.state = this.loadState();
        this.archives = this.loadArchives();

        window.addEventListener('resize', () => {
          this.autoResizeAll();
        });
        window.addEventListener('orientationchange', () => {
          setTimeout(() => this.autoResizeAll(), 120);
        });

        this.render();
      }

      getDefaultState() {
        return {
          targetName: '',
          q1Emotion: '화가 난다',
          q1Reason: '',
          q2Want: '',
          q3Should: '',
          q3ShouldNot: '',
          q4Should: '',
          q4Need: '',
          q5Thoughts: '',
          q6NoMoreWant: '',
          q6NoMoreDo: '',
          inquiries: {
            1: { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' },
            2: { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' },
            3: { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' },
            4: { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' },
            5: { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' }
          },
          turnarounds: [
            { statement: '', reason: '' },
            { statement: '', reason: '' },
            { statement: '', reason: '' },
            { statement: '', reason: '' }
          ],
          q6TurnaroundWilling: '',
          q6TurnaroundLookForward: ''
        };
      }

      normalizeState(raw) {
        const def = this.getDefaultState();
        if (!raw || typeof raw !== 'object') return def;
        return {
          ...def,
          ...raw,
          inquiries: {
            1: { ...def.inquiries[1], ...(raw.inquiries && raw.inquiries[1] ? raw.inquiries[1] : {}) },
            2: { ...def.inquiries[2], ...(raw.inquiries && raw.inquiries[2] ? raw.inquiries[2] : {}) },
            3: { ...def.inquiries[3], ...(raw.inquiries && raw.inquiries[3] ? raw.inquiries[3] : {}) },
            4: { ...def.inquiries[4], ...(raw.inquiries && raw.inquiries[4] ? raw.inquiries[4] : {}) },
            5: { ...def.inquiries[5], ...(raw.inquiries && raw.inquiries[5] ? raw.inquiries[5] : {}) }
          },
          turnarounds: Array.isArray(raw.turnarounds) && raw.turnarounds.length === 4
            ? raw.turnarounds.map(t => ({ statement: t.statement || '', reason: t.reason || '' }))
            : def.turnarounds
        };
      }

      loadState() {
        try {
          const saved = localStorage.getItem(this.storageKey);
          if (!saved) return this.getDefaultState();
          return this.normalizeState(JSON.parse(saved));
        } catch (e) {
          return this.getDefaultState();
        }
      }

      saveState() {
        try {
          localStorage.setItem(this.storageKey, JSON.stringify(this.state));
          const badge = document.getElementById('saveStatus');
          if (badge) {
            badge.textContent = '임시 저장됨';
            clearTimeout(this.saveTimer);
            this.saveTimer = setTimeout(() => {
              badge.textContent = '자동 저장됨';
            }, 1200);
          }
        } catch (e) {
          console.error('Save failed', e);
        }
      }

      loadArchives() {
        try {
          const raw = localStorage.getItem(this.archiveStorageKey);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      saveArchives() {
        try {
          localStorage.setItem(this.archiveStorageKey, JSON.stringify(this.archives));
        } catch (e) {
          console.error('Archive save failed', e);
        }
      }

      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      getDisplayName() {
        const name = (this.state.targetName || '').trim();
        return name || '그 사람';
      }

      setStep(step) {
        this.currentStep = step;
        document.querySelectorAll('.step-tab').forEach(tab => {
          tab.classList.toggle('active', Number(tab.dataset.step) === step);
        });
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      updateField(key, value) {
        this.state[key] = value;
        this.saveState();
        if (key === 'targetName') {
          const display = this.getDisplayName();
          document.querySelectorAll('.js-target-display').forEach(el => {
            el.textContent = display;
          });
        }
      }

      selectEmotion(emotion) {
        this.state.q1Emotion = emotion;
        this.saveState();
        const emotionInput = document.getElementById('q1EmotionInput');
        if (emotionInput) {
          emotionInput.value = emotion;
          this.autoResizeElement(emotionInput);
        }
        document.querySelectorAll('.js-emotion-chip').forEach(btn => {
          btn.classList.toggle('selected', btn.dataset.emotion === emotion);
        });
      }

      setInquiryIndex(idx) {
        this.activeInquiryIndex = idx;
        this.render();
      }

      updateInquiryField(field, value) {
        const idx = this.activeInquiryIndex;
        if (!this.state.inquiries[idx]) {
          this.state.inquiries[idx] = { q1Yn: '', q1Text: '', q2Yn: '', q2Text: '', q3Text: '', q4Text: '' };
        }
        this.state.inquiries[idx][field] = value;
        this.saveState();
      }

      selectInquiryYn(field, val) {
        this.updateInquiryField(field, val);
        this.render();
      }

      updateTurnaround(index, field, value) {
        this.state.turnarounds[index][field] = value;
        this.saveState();
      }

      /* 모든 입력창의 스크롤 제거 + 글자 양에 따른 자동 너비/높이 확장 */
      autoResizeElement(el) {
        if (!el) return;
        const mirror = document.getElementById('textMeasureMirror');

        if (el.classList.contains('inline-auto-field') && mirror) {
          const container = el.parentElement;
          const maxWidth = container ? Math.max(200, container.clientWidth - 36) : 600;
          const minWidth = Number(el.dataset.minWidth || 150);
          const sampleText = el.value || el.placeholder || '';
          const firstLine = sampleText.split('\n')[0];

          mirror.style.fontSize = window.getComputedStyle(el).fontSize;
          mirror.style.fontWeight = window.getComputedStyle(el).fontWeight;
          mirror.textContent = firstLine;

          const measuredWidth = mirror.offsetWidth + 24;
          if (sampleText.includes('\n') || measuredWidth >= maxWidth) {
            el.style.width = '100%';
          } else {
            el.style.width = Math.min(Math.max(minWidth, measuredWidth), maxWidth) + 'px';
          }
        }

        el.style.height = 'auto';
        el.style.height = (el.scrollHeight + 2) + 'px';
      }

      autoResizeAll() {
        document.querySelectorAll('textarea.auto-field, textarea.inline-auto-field').forEach(el => {
          this.autoResizeElement(el);
        });
      }

      attachAutoResizeEvents() {
        const fields = document.querySelectorAll('textarea.auto-field, textarea.inline-auto-field');
        fields.forEach(el => {
          this.autoResizeElement(el);
          el.addEventListener('input', () => this.autoResizeElement(el));
        });
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            document.querySelectorAll('textarea.auto-field, textarea.inline-auto-field').forEach(el => {
              this.autoResizeElement(el);
            });
          });
        }
      }

      getStatementSummary(num, targetState = this.state) {
        const name = (targetState.targetName || '').trim() || '그 사람';
        switch (num) {
          case 1: {
            const emo = (targetState.q1Emotion || '').trim() || '화가 난다';
            const reason = (targetState.q1Reason || '').trim();
            return reason
              ? `나는 ${name} 때문에 ${emo}. 왜냐하면 ${reason} 때문이다.`
              : `나는 ${name} 때문에 ${emo}. (1번 이유 미작성)`;
          }
          case 2: {
            const want = (targetState.q2Want || '').trim();
            return want
              ? `나는 ${name} 이(가) ${want} 하기를 원한다.`
              : `나는 ${name} 이(가) [원하는 변화] 하기를 원한다. (2번 미작성)`;
          }
          case 3: {
            const s1 = (targetState.q3Should || '').trim();
            const s2 = (targetState.q3ShouldNot || '').trim();
            const parts = [];
            if (s1) parts.push(`${name} 는(은) ${s1} 해야 한다.`);
            if (s2) parts.push(`${name} 는(은) ${s2} 하지 말아야 한다.`);
            return parts.length ? parts.join('\n') : `${name} 는(은) ~ 해야 한다 / 하지 말아야 한다. (3번 미작성)`;
          }
          case 4: {
            const n1 = (targetState.q4Should || '').trim();
            const n2 = (targetState.q4Need || '').trim();
            const parts = [];
            if (n1) parts.push(`${name} 는(은) ${n1} 해야 한다.`);
            if (n2) parts.push(`나는 ${name} 이(가) ${n2} 기를 필요로 한다.`);
            return parts.length ? parts.join('\n') : `나는 ${name} 이(가) ~ 기를 필요로 한다. (4번 미작성)`;
          }
          case 5: {
            const t = (targetState.q5Thoughts || '').trim();
            return t
              ? `${name} 는(은) ${t}`
              : `${name} 는(은) [생각 목록] (5번 미작성)`;
          }
          default:
            return '';
        }
      }

      render() {
        const container = document.getElementById('appContent');
        if (!container) return;

        const loadedItem = this.loadedArchiveId
          ? this.archives.find(a => a.id === this.loadedArchiveId)
          : null;

        const activeBanner = loadedItem ? `
          <div class="active-record-banner">
            <div>
              📌 불러온 기록 편집 중: <strong>${this.escapeHtml(loadedItem.title)}</strong>
            </div>
            <button type="button" class="btn btn-sm btn-secondary" onclick="app.quickOverwriteCurrentArchive()">
              현재 기록에 덮어쓰기 저장
            </button>
          </div>
        ` : '';

        if (this.currentStep === 1) {
          container.innerHTML = activeBanner + this.renderStep1();
        } else if (this.currentStep === 2) {
          container.innerHTML = activeBanner + this.renderStep2();
        } else {
          container.innerHTML = activeBanner + this.renderStep3();
        }

        requestAnimationFrame(() => {
          this.attachAutoResizeEvents();
        });
      }

      renderStep1() {
        const nameDisplay = this.escapeHtml(this.getDisplayName());
        const emotions = ['화가 난다', '슬프다', '혼란스럽다', '두렵다', '실망스럽다'];

        return `
          <div class="guide-banner">
            <h2>1단계. 스스로에게 질문하기</h2>
            <p>
              당신을 화나게 하거나 슬프게 하거나 실망시키는 사람은 누구인가요? 당신은 그 사람의 어떤 점이 맘에 들지 않았나요?<br />
              <strong>(가혹하고 유치하며 편협하게 쓰세요. 검열하지 말고 떠오르는 그대로 적어보세요.)</strong>
            </p>
          </div>

          <!-- 1번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 1</span>
              <div>
                <h3 class="q-title">당신을 화나게 하거나 슬프게 하거나 실망시키는 사람은 누구이며, 그 이유는 무엇인가요?</h3>
                <p class="q-hint">감정을 선택하거나 직접 수정하고, 이유를 자유롭게 적어주세요.</p>
              </div>
            </div>

            <div class="emotion-chips">
              ${emotions.map(emo => `
                <button type="button"
                  class="chip-btn js-emotion-chip ${this.state.q1Emotion === emo ? 'selected' : ''}"
                  data-emotion="${emo}"
                  onclick="app.selectEmotion('${emo}')">${emo}</button>
              `).join('')}
            </div>

            <div class="sentence-flow">
              <span class="sentence-text">나는 (이름:</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="140"
                placeholder="상대방 이름"
                oninput="app.updateField('targetName', this.value)">${this.escapeHtml(this.state.targetName)}</textarea>
              <span class="sentence-text">) 때문에</span>
              <textarea rows="1"
                id="q1EmotionInput"
                class="inline-auto-field"
                data-min-width="140"
                placeholder="감정 (예: 화가 난다)"
                oninput="app.updateField('q1Emotion', this.value)">${this.escapeHtml(this.state.q1Emotion)}</textarea>
              <span class="sentence-text">. 왜냐하면</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="그 사람 때문에 힘든 구체적인 이유를 적어주세요"
                oninput="app.updateField('q1Reason', this.value)">${this.escapeHtml(this.state.q1Reason)}</textarea>
              <span class="sentence-text">때문이다.</span>
            </div>
          </section>

          <!-- 2번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 2</span>
              <div>
                <h3 class="q-title">당신은 그 사람이 어떻게 바뀌기를 원하나요? 당신은 그 사람이 어떻게 하기를 원하나요?</h3>
              </div>
            </div>

            <div class="sentence-flow">
              <span class="sentence-text">나는</span>
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">이(가)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="어떻게 바뀌고 행동하기를 원하는지 적어주세요"
                oninput="app.updateField('q2Want', this.value)">${this.escapeHtml(this.state.q2Want)}</textarea>
              <span class="sentence-text">하기를 원한다.</span>
            </div>
          </section>

          <!-- 3번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 3</span>
              <div>
                <h3 class="q-title">그 사람이 해야 하거나 하지 말아야 할 것들(행위, 태도, 생각, 느낌 등)은 무엇인가요?</h3>
              </div>
            </div>

            <div class="sentence-flow">
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">는(은)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="해야 할 행위, 태도, 생각, 느낌"
                oninput="app.updateField('q3Should', this.value)">${this.escapeHtml(this.state.q3Should)}</textarea>
              <span class="sentence-text">해야 한다.</span>
            </div>

            <div class="sentence-flow">
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">는(은)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="하지 말아야 할 행위, 태도, 생각, 느낌"
                oninput="app.updateField('q3ShouldNot', this.value)">${this.escapeHtml(this.state.q3ShouldNot)}</textarea>
              <span class="sentence-text">하지 말아야 한다.</span>
            </div>
          </section>

          <!-- 4번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 4</span>
              <div>
                <h3 class="q-title">당신은 그 사람에게 무엇인가를 필요로 하나요? 그 사람이 당신에게 어떻게 해주면, 당신은 행복해질까요?</h3>
                <p class="q-hint">(오늘은 당신의 생일이라서 원하는 것은 뭐든지 가질 수 있다고 상상하세요.)</p>
              </div>
            </div>

            <div class="sentence-flow">
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">는(은)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="나를 행복하게 해주기 위해 해야 할 것"
                oninput="app.updateField('q4Should', this.value)">${this.escapeHtml(this.state.q4Should)}</textarea>
              <span class="sentence-text">해야 한다.</span>
            </div>

            <div class="sentence-flow">
              <span class="sentence-text">나는</span>
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">이(가)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="260"
                placeholder="필요로 하는 말, 행동, 태도"
                oninput="app.updateField('q4Need', this.value)">${this.escapeHtml(this.state.q4Need)}</textarea>
              <span class="sentence-text">기를 필요로 한다.</span>
            </div>
          </section>

          <!-- 5번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 5</span>
              <div>
                <h3 class="q-title">당신은 그 사람을 어떻게 생각하나요? 목록을 만들어 보세요.</h3>
                <p class="q-hint">(관대하지 마세요. 판단하는 단어와 문장을 모두 적어보세요.)</p>
              </div>
            </div>

            <div class="sentence-flow">
              <span class="target-pill js-target-display">${nameDisplay}</span>
              <span class="sentence-text">는(은)</span>
              <textarea rows="1"
                class="inline-auto-field"
                data-min-width="280"
                placeholder="이기적이다, 무책임하다, 내 마음을 몰라준다 등 생각나는 대로 나열해보세요"
                oninput="app.updateField('q5Thoughts', this.value)">${this.escapeHtml(this.state.q5Thoughts)}</textarea>
            </div>
          </section>

          <!-- 6번 문항 -->
          <section class="q-card">
            <div class="q-header">
              <span class="q-badge">질문 6</span>
              <div>

        `;
      }

      /* =========================================
         기록 보관함 (저장 및 불러오기) 기능
         ========================================= */
      getFormattedNow() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
      }

      getDefaultArchiveTitle() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const name = (this.state.targetName || '').trim();
        return name ? `${yyyy}-${mm}-${dd} · ${name}에 대한 작업` : `${yyyy}-${mm}-${dd} · 내면의 작업`;
      }

      openArchiveModal() {
        this.confirmDeleteId = null;
        this.renderArchiveModalBody();
        document.getElementById('archiveModal').classList.add('open');
      }

      closeArchiveModal() {
        this.confirmDeleteId = null;
        document.getElementById('archiveModal').classList.remove('open');
      }

      renderArchiveModalBody() {
        const body = document.getElementById('archiveModalBody');
        if (!body) return;

        const loadedItem = this.loadedArchiveId
          ? this.archives.find(a => a.id === this.loadedArchiveId)
          : null;

        const defaultTitle = loadedItem ? loadedItem.title : this.getDefaultArchiveTitle();

        const listHtml = this.archives.length === 0
          ? `<div style="text-align:center; padding: 28px 16px; color: var(--text-muted); background: #FCFBF8; border-radius: 12px; border: 1px dashed var(--border);">
               아직 저장된 기록이 없습니다.<br />위 입력창에서 현재 작성한 내용을 저장해 보세요.
             </div>`
          : this.archives.map(item => {
              const isCurrent = item.id === this.loadedArchiveId;
              const isConfirmingDel = item.id === this.confirmDeleteId;
              const previewText = this.getStatementSummary(1, item.data || {});
              return `
                <div class="archive-card ${isCurrent ? 'current-loaded' : ''}">
                  <div class="archive-info">
                    <div class="archive-card-title">
                      ${this.escapeHtml(item.title)}
                      ${isCurrent ? '<span style="font-size:0.78rem; background:var(--primary); color:#fff; padding:2px 8px; border-radius:10px; margin-left:6px;">현재 열림</span>' : ''}
                    </div>
                    <div class="archive-card-meta">
                      대상: <strong>${this.escapeHtml(item.targetName || '미입력')}</strong> · 저장일시: ${this.escapeHtml(item.savedAt)}
                    </div>
                    <div class="archive-card-preview">${this.escapeHtml(previewText)}</div>
                  </div>
                  <div class="archive-actions">
                    <button type="button" class="btn btn-sm btn-primary" onclick="app.loadFromArchive('${item.id}')">불러오기</button>
                    ${isConfirmingDel
                      ? `<button type="button" class="btn btn-sm btn-danger-solid" onclick="app.deleteArchiveItem('${item.id}')">삭제 확인</button>
                         <button type="button" class="btn btn-sm btn-outline" onclick="app.cancelDeleteArchive()">취소</button>`
                      : `<button type="button" class="btn btn-sm btn-danger-outline" onclick="app.askDeleteArchive('${item.id}')">삭제</button>`
                    }
                  </div>
                </div>
              `;
            }).join('');

        body.innerHTML = `
          <div class="save-box">
            <div class="save-box-title">현재 작성 중인 내용 저장하기</div>
            <div class="save-input-row">
              <input type="text"
                id="archiveTitleInput"
                class="archive-title-input"
                value="${this.escapeHtml(defaultTitle)}"
                placeholder="저장할 기록 제목을 입력하세요" />
              <button type="button" class="btn btn-primary" onclick="app.saveCurrentToArchive(false)">
                💾 새 기록으로 저장
              </button>
              ${loadedItem ? `
                <button type="button" class="btn btn-secondary" onclick="app.saveCurrentToArchive(true)">
                  덮어쓰기
                </button>
              ` : ''}
            </div>
          </div>

          <div class="archive-list-header">
            <h4>저장된 기록 목록 (${this.archives.length}건)</h4>
          </div>
          <div>${listHtml}</div>

          <div class="backup-bar">
            <span style="font-size: 0.86rem; color: var(--text-muted);">
              기기를 변경하거나 안전하게 보관하려면 파일로 백업하세요.
            </span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn btn-sm btn-outline" onclick="app.exportArchivesToJson()">📥 파일로 백업 (JSON)</button>
              <button type="button" class="btn btn-sm btn-outline" onclick="app.triggerJsonImport()">📤 파일에서 불러오기</button>
            </div>
          </div>
        `;
      }

      saveCurrentToArchive(overwrite = false) {
        const input = document.getElementById('archiveTitleInput');
        const title = (input ? input.value : '').trim() || this.getDefaultArchiveTitle();
        const clonedData = JSON.parse(JSON.stringify(this.state));
        const nowStr = this.getFormattedNow();
        const targetName = (this.state.targetName || '').trim() || '그 사람';

        if (overwrite && this.loadedArchiveId) {
          const idx = this.archives.findIndex(a => a.id === this.loadedArchiveId);
          if (idx !== -1) {
            this.archives[idx] = {
              ...this.archives[idx],
              title,
              targetName,
              savedAt: nowStr,
              data: clonedData
            };
            this.saveArchives();
            this.renderArchiveModalBody();
            this.render();
            this.showToast('기존 기록에 덮어쓰기 저장되었습니다.');
            return;
          }
        }

        const newId = 'work_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        this.archives.unshift({
          id: newId,
          title,
          targetName,
          savedAt: nowStr,
          data: clonedData
        });
        this.loadedArchiveId = newId;
        this.saveArchives();
        this.renderArchiveModalBody();
        this.render();
        this.showToast('기록 보관함에 새로 저장되었습니다.');
      }

      quickOverwriteCurrentArchive() {
        if (!this.loadedArchiveId) return;
        const idx = this.archives.findIndex(a => a.id === this.loadedArchiveId);
        if (idx === -1) return;
        this.archives[idx] = {
          ...this.archives[idx],
          targetName: (this.state.targetName || '').trim() || '그 사람',
          savedAt: this.getFormattedNow(),
          data: JSON.parse(JSON.stringify(this.state))
        };
        this.saveArchives();
        this.showToast('불러온 기록에 변경 내용이 저장되었습니다.');
      }

      loadFromArchive(id) {
        const found = this.archives.find(a => a.id === id);
        if (!found) return;
        this.state = this.normalizeState(JSON.parse(JSON.stringify(found.data)));
        this.loadedArchiveId = found.id;
        this.activeInquiryIndex = 1;
        this.saveState();
        this.closeArchiveModal();
        this.setStep(1);
        this.showToast(`'${found.title}' 기록을 불러왔습니다.`);
      }

      askDeleteArchive(id) {
        this.confirmDeleteId = id;
        this.renderArchiveModalBody();
      }

      cancelDeleteArchive() {
        this.confirmDeleteId = null;
        this.renderArchiveModalBody();
      }

      deleteArchiveItem(id) {
        this.archives = this.archives.filter(a => a.id !== id);
        if (this.loadedArchiveId === id) {
          this.loadedArchiveId = null;
        }
        this.confirmDeleteId = null;
        this.saveArchives();
        this.renderArchiveModalBody();
        this.render();
        this.showToast('선택한 기록이 삭제되었습니다.');
      }

      exportArchivesToJson() {
        const payload = {
          app: 'TheWorkWorkbook',
          exportedAt: this.getFormattedNow(),
          currentDraft: this.state,
          archives: this.archives
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = `내면의작업_백업_${dateStr}.json`;
        link.click();
        URL.revokeObjectURL(url);
        this.showToast('백업 JSON 파일이 저장되었습니다.');
      }

      triggerJsonImport() {
        const input = document.getElementById('jsonFileInput');
        if (input) {
          input.value = '';
          input.click();
        }
      }

      handleJsonFileImport(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            let importedCount = 0;

            if (parsed && Array.isArray(parsed.archives)) {
              const existingIds = new Set(this.archives.map(a => a.id));
              parsed.archives.forEach(item => {
                if (item && item.data) {
                  const id = existingIds.has(item.id)
                    ? 'work_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
                    : (item.id || 'work_' + Date.now());
                  this.archives.unshift({
                    id,
                    title: item.title || '불러온 기록',
                    targetName: item.targetName || (item.data.targetName || '그 사람'),
                    savedAt: item.savedAt || this.getFormattedNow(),
                    data: this.normalizeState(item.data)
                  });
                  importedCount++;
                }
              });

              if (importedCount === 0 && parsed.currentDraft) {
                this.state = this.normalizeState(parsed.currentDraft);
                this.saveState();
                this.render();
                this.closeArchiveModal();
                this.showToast('파일의 작업 내용을 화면에 불러왔습니다.');
                return;
              }
            } else if (parsed && typeof parsed === 'object' && ('targetName' in parsed || 'q1Reason' in parsed)) {
              const norm = this.normalizeState(parsed);
              const newId = 'work_' + Date.now();
              this.archives.unshift({
                id: newId,
                title: file.name.replace(/\.json$/i, ''),
                targetName: norm.targetName || '그 사람',
                savedAt: this.getFormattedNow(),
                data: norm
              });
              importedCount = 1;
            } else {
              this.showToast('올바른 워크북 백업 파일이 아닙니다.');
              return;
            }

            this.saveArchives();
            this.renderArchiveModalBody();
            this.showToast(`파일에서 ${importedCount}건의 기록을 보관함으로 가져왔습니다.`);
          } catch (err) {
            console.error(err);
            this.showToast('파일을 읽는 중 오류가 발생했습니다.');
          }
        };
        reader.readAsText(file);
      }

      /* =========================================
         요약 및 카카오톡 이미지 공유 기능
         ========================================= */
      openExportModal() {
        const summaryEl = document.getElementById('captureSummaryArea');
        if (!summaryEl) return;

        const today = new Date().toLocaleDateString('ko-KR', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        const name = this.getDisplayName();

        const inquiryBlocks = [1, 2, 3, 4, 5].map(num => {
          const inq = this.state.inquiries[num];
          if (!inq) return '';
          const hasAny = inq.q1Yn || inq.q1Text || inq.q2Yn || inq.q2Text || inq.q3Text || inq.q4Text;
          if (!hasAny) return '';
          return `
            <div class="report-item" style="border-top: 1px dashed #E5DFD3; padding-top: 12px; margin-top: 12px;">
              <div class="report-q">[${num}번 진술 탐구] ${this.escapeHtml(this.getStatementSummary(num))}</div>
              <div class="report-a">
                ${(inq.q1Yn || inq.q1Text) ? `<div><strong>1. 그게 진실인가요?</strong> ${inq.q1Yn ? `[${this.escapeHtml(inq.q1Yn)}]` : ''} ${this.escapeHtml(inq.q1Text)}</div>` : ''}
                ${(inq.q2Yn || inq.q2Text) ? `<div style="margin-top:6px;"><strong>2. 확실히 알 수 있나요?</strong> ${inq.q2Yn ? `[${this.escapeHtml(inq.q2Yn)}]` : ''} ${this.escapeHtml(inq.q2Text)}</div>` : ''}
                ${inq.q3Text ? `<div style="margin-top:6px;"><strong>3. 그 생각을 할 때 반응:</strong>\n${this.escapeHtml(inq.q3Text)}</div>` : ''}
                ${inq.q4Text ? `<div style="margin-top:6px;"><strong>4. 그 생각이 없다면 나는 누구일까요:</strong>\n${this.escapeHtml(inq.q4Text)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        const turnaroundBlocks = this.state.turnarounds
          .map((t, i) => {
            if (!t.statement.trim() && !t.reason.trim()) return '';
            return `
              <div class="report-item">
                <div class="report-q">뒤바꾸기 ${i + 1}</div>
                <div class="report-a"><strong>${this.escapeHtml(t.statement || '(문장 미입력)')}</strong>${t.reason ? `\n${this.escapeHtml(t.reason)}` : ''}</div>
              </div>
            `;
          })
          .join('');

        const q6TurnParts = [];
        if (this.state.q6TurnaroundWilling.trim()) {
          q6TurnParts.push(`나는 기꺼이 ${this.state.q6TurnaroundWilling.trim()} 하겠다.`);
        }
        if (this.state.q6TurnaroundLookForward.trim()) {
          q6TurnParts.push(`나는 ${this.state.q6TurnaroundLookForward.trim()} 하기를 고대한다.`);
        }

        summaryEl.innerHTML = `
          <div class="report-header">
            <h2 class="report-title">내면의 작업 (The Work) 요약 리포트</h2>
            <div class="report-meta">대상: <strong>${this.escapeHtml(name)}</strong> · ${today}</div>
          </div>

          <div class="report-section">
            <h3 class="report-section-title">1. 스스로에게 질문하기</h3>
            <div class="report-item">
              <div class="report-q">1) 감정과 이유</div>
              <div class="report-a">${this.escapeHtml(this.getStatementSummary(1))}</div>
            </div>
            <div class="report-item">
              <div class="report-q">2) 바라는 변화</div>
              <div class="report-a">${this.escapeHtml(this.getStatementSummary(2))}</div>
            </div>
            <div class="report-item">
              <div class="report-q">3) 해야 하거나 하지 말아야 할 것</div>
              <div class="report-a">${this.escapeHtml(this.getStatementSummary(3))}</div>
            </div>
            <div class="report-item">
              <div class="report-q">4) 필요로 하는 것</div>
              <div class="report-a">${this.escapeHtml(this.getStatementSummary(4))}</div>
            </div>
            <div class="report-item">
              <div class="report-q">5) 그 사람에 대한 생각</div>
              <div class="report-a">${this.escapeHtml(this.getStatementSummary(5))}</div>
            </div>
            <div class="report-item">
              <div class="report-q">6) 다시는 경험하고 싶지 않은 점</div>
              <div class="report-a">${
                (this.state.q6NoMoreWant.trim() || this.state.q6NoMoreDo.trim())
                  ? `${this.state.q6NoMoreWant.trim() ? `나는 앞으로 다시는 ${this.escapeHtml(this.state.q6NoMoreWant.trim())} 하고 싶지 않다.\n` : ''}${this.state.q6NoMoreDo.trim() ? `나는 앞으로 다시는 ${this.escapeHtml(this.state.q6NoMoreDo.trim())} 하지 않겠다.` : ''}`.trim()
                  : '(작성된 내용 없음)'
              }</div>
            </div>
          </div>

          <div class="report-section">
            <h3 class="report-section-title">2. 스스로 하기: 탐구</h3>
            ${inquiryBlocks || '<div class="report-a">작성된 탐구 내용이 없습니다.</div>'}
          </div>

          <div class="report-section" style="margin-bottom: 0;">
            <h3 class="report-section-title">3. 뒤바꿔보세요</h3>
            ${turnaroundBlocks || '<div class="report-a">작성된 뒤바꾸기 내용이 없습니다.</div>'}
            ${q6TurnParts.length ? `
              <div class="report-item" style="margin-top: 12px;">
                <div class="report-q">6번 문항 뒤바꾸기</div>
                <div class="report-a">${this.escapeHtml(q6TurnParts.join('\n'))}</div>
              </div>
            ` : ''}
          </div>
        `;

        document.getElementById('exportModal').classList.add('open');
      }

      closeExportModal() {
        document.getElementById('exportModal').classList.remove('open');
      }

      async generateSummaryCanvas() {
        const target = document.getElementById('captureSummaryArea');
        return await html2canvas(target, {
          scale: 2,
          backgroundColor: '#FAF8F4',
          useCORS: true
        });
      }

      async downloadSummaryImage() {
        try {
          this.showToast('이미지를 생성하고 있습니다...');
          const canvas = await this.generateSummaryCanvas();
          const link = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          link.download = `내면의작업_요약_${dateStr}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          this.showToast('요약 이미지가 저장되었습니다.');
        } catch (err) {
          console.error(err);
          this.showToast('이미지 저장 중 오류가 발생했습니다.');
        }
      }

      async shareSummaryToKakao() {
        try {
          this.showToast('공유할 이미지를 준비 중입니다...');
          const canvas = await this.generateSummaryCanvas();
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
          const dateStr = new Date().toISOString().slice(0, 10);
          const file = new File([blob], `내면의작업_요약_${dateStr}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: '내면의 작업 (The Work) 요약',
              text: '네 가지 질문 워크북 요약 이미지입니다.'
            });
          } else {
            const link = document.createElement('a');
            link.download = `내면의작업_요약_${dateStr}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showToast('이미지가 저장되었습니다. 카카오톡에서 저장된 이미지를 선택해 공유해주세요.');
          }
        } catch (err) {
          if (err && err.name !== 'AbortError') {
            console.error(err);
            this.showToast('공유 창을 여는 중 문제가 발생했습니다.');
          }
        }
      }

      openResetModal() {
        document.getElementById('confirmModal').classList.add('open');
      }

      closeResetModal() {
        document.getElementById('confirmModal').classList.remove('open');
      }

      confirmReset() {
        this.state = this.getDefaultState();
        this.loadedArchiveId = null;
        this.activeInquiryIndex = 1;
        this.saveState();
        this.closeResetModal();
        this.setStep(1);
        this.showToast('새 작업을 시작할 수 있도록 화면이 초기화되었습니다.');
      }

      showToast(message) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }
    }

    window.app = new TheWorkApp();
  </script>
</body>
</html>
